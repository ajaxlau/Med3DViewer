name: Build

on:
  push:
    branches: ["main", "beta"]
  pull_request:
    branches: ["main", "beta"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Validate npm manifests
        run: npm run check:manifests
          
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test Worker downloads in the Cloudflare runtime
        run: node scripts/test-worker-runtime.mjs

      - name: Build the Cloudflare Workers artifact with a low open-file limit
        run: |
          ulimit -n 256
          npm run build:cloudflare

      - name: Validate Worker packaging without publishing
        run: npm run check:cloudflare

      - name: Validate beta Preview and cleanup packaging without publishing
        env:
          SHARES_DB_NAME: med3dviewer-shares-beta
          SHARES_DB_ID: 22222222-2222-4222-8222-222222222222
          SHARES_RESOURCE_TIER: beta
        run: |
          npm run check:shares:beta
          npm run check:shares:beta:cleanup

      - name: Validate isolated Box-test packaging without publishing
        env:
          SHARES_DB_ID: 33333333-3333-4333-8333-333333333333
        run: node scripts/share-cloudflare.mjs box-test check
