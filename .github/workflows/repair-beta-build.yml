name: Repair beta preview credential
on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/repair-beta-build.yml
      - scripts/repair-beta-build.mjs
      - tests/betaBuildRepair.test.mjs
permissions:
  contents: read
concurrency:
  group: beta-preview-credential-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'ajaxlau/Med3DViewer' && github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test beta-only repair safeguards
        run: node --test tests/betaBuildRepair.test.mjs
      - name: Inspect the pending beta build without changing Cloudflare settings
        env:
          CF_BUILDS_REPAIR_TOKEN: ${{ secrets.CF_BUILDS_REPAIR_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { apiClient, repairBeta } from './scripts/repair-beta-build.mjs';
          const token = process.env.CF_BUILDS_REPAIR_TOKEN;
          const api = apiClient(token);
          const report = data => console.log(JSON.stringify(data).split(token).join('[REDACTED]'));
          await repairBeta({ api, report });
          const limits = await api('GET', '/builds/account/limits');
          report({ build_limits: limits });
          const recent = await api('GET', '/builds/workers/24ad5277946e482fa74593ac733fddc3/builds?per_page=30');
          assert(Array.isArray(recent), 'Unexpected build-list response.');
          for (const item of recent) report({ recent_beta_build: { build_uuid: item.build_uuid,
            status: item.status, outcome: item.build_outcome, created_on: item.created_on,
            branch: item.build_trigger_metadata?.branch, commit: item.build_trigger_metadata?.commit_hash } });
          const id = 'dc626443-6891-4da3-b0a8-2e92e2325b49';
          const build = await api('GET', `/builds/builds/${id}`);
          assert.equal(build.build_trigger_metadata?.branch, 'beta');
          assert.equal(build.build_trigger_metadata?.provider_account_name, 'ajaxlau');
          report({ build_uuid: id, status: build.status, outcome: build.build_outcome,
            preview_url: build.preview_url, created_on: build.created_on, completed_on: build.completed_on });
          const lines = [];
          let cursor = '';
          for (let page = 0; page < 20; page++) {
            const log = await api('GET', `/builds/builds/${id}/logs${cursor ? `?cursor=${encodeURIComponent(cursor)}` : ''}`);
            for (const entry of log.lines ?? []) {
              const line = Array.isArray(entry) ? entry.find(p => typeof p === 'string') : typeof entry === 'string' ? entry : entry?.line;
              if (typeof line === 'string') lines.push(line);
            }
            if (!log.truncated || !log.cursor || cursor === log.cursor) break;
            cursor = log.cursor;
          }
          for (const line of lines.slice(-35)) report({ build_log: line });
          NODE
