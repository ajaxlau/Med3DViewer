name: Verify beta preview
on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/repair-beta-build.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read public beta assets without deployment credentials
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = new URL('https://beta-ntec3dpo-m3dv.x-panda.workers.dev/');
          const get = async path => {
            const url = new URL(path, base);
            assert.equal(url.origin, base.origin);
            const response = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0' }, signal: AbortSignal.timeout(30000) });
            assert.equal(response.status, 200, url.pathname);
            const type = response.headers.get('content-type') || '';
            if (url.pathname === '/') assert(/text\/html/i.test(type), 'HTML content type');
            if (/\.(png|ico)$/i.test(url.pathname)) assert(/image\//i.test(type), url.pathname);
            if (url.pathname.endsWith('.js')) assert(/javascript/i.test(type), url.pathname);
            if (url.pathname.endsWith('.css')) assert(/text\/css/i.test(type), url.pathname);
            const data = await response.text();
            console.log(JSON.stringify({ path: url.pathname, status: response.status, type }));
            return data;
          };
          const html = await get('/');
          assert(html.includes('Medical 3D Viewer'), 'Expected app HTML.');
          const refs = [...html.matchAll(/<(?:script|link)\b[^>]*\b(?:src|href)=["']([^"']+)["']/gi)]
            .map(match => match[1]).filter(path => !/^(https?:)?\/\//i.test(path));
          const paths = [...new Set([...refs, '/sw.js', '/registerSW.js', '/manifest.webmanifest'])];
          const resources = await Promise.allSettled(paths.map(get));
          for (const result of resources) if (result.status === 'rejected') throw result.reason;
          const manifest = JSON.parse(resources[paths.indexOf('/manifest.webmanifest')].value);
          const icons = await Promise.allSettled(manifest.icons.map(icon => get(icon.src)));
          for (const result of icons) if (result.status === 'rejected') throw result.reason;
          const missing = await fetch(new URL('/assets/missing-verification-script.js', base), { headers: { 'User-Agent': 'Mozilla/5.0' }, signal: AbortSignal.timeout(30000) });
          assert.equal(missing.status, 404, 'Missing JavaScript must return 404.');
          console.log(JSON.stringify({ preview_url: base.href, public_asset_smoke: 'pass' }));
          NODE
