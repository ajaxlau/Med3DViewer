name: Repair Cloudflare preview trigger

on:
  push:
    branches: ["codex/review-beta-branch-for-conflicts-and-bugs"]
    paths:
      - '.github/workflows/repair-cloudflare-preview.yml'
      - 'scripts/repair-cloudflare-preview.mjs'
      - 'tests/cloudflarePreviewRepair.test.mjs'

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-trigger-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Inspect and repair only the preview trigger
    if: github.repository == 'ajaxlau/Med3DViewer' && github.ref == 'refs/heads/codex/review-beta-branch-for-conflicts-and-bugs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test repair safeguards without credentials
        run: node --test tests/cloudflarePreviewRepair.test.mjs
      - name: Read the successful preview URL without changing Cloudflare settings
        env:
          CF_BUILDS_REPAIR_TOKEN: ${{ secrets.CF_BUILDS_REPAIR_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { cloudflareApi, buildLogLines, repairPreviewTrigger, PREVIEW_BRANCH } from './scripts/repair-cloudflare-preview.mjs';
          const api = cloudflareApi(process.env.CF_BUILDS_REPAIR_TOKEN);
          await repairPreviewTrigger({ api, report: value => console.log(JSON.stringify(value)) });
          const buildUuid = 'a5df33e2-b974-4745-aaf8-b8d5c89c8e7c';
          const build = await api('GET', `/builds/builds/${buildUuid}`);
          assert.equal(build.build_trigger_metadata?.branch, PREVIEW_BRANCH);
          assert.equal(build.build_outcome, 'success');
          const urls = new Set();
          let cursor = '';
          for (let page = 0; page < 20; page++) {
            const logs = await api('GET', `/builds/builds/${buildUuid}/logs${cursor ? `?cursor=${encodeURIComponent(cursor)}` : ''}`);
            for (const line of buildLogLines(logs)) {
              for (const match of line.matchAll(/https:\/\/[a-z0-9.-]+\.workers\.dev\b/gi)) urls.add(match[0]);
            }
            if (!logs.truncated || !logs.cursor || logs.cursor === cursor) break;
            cursor = logs.cursor;
          }
          console.log(JSON.stringify({ build_uuid: buildUuid, outcome: build.build_outcome, preview_urls: [...urls] }));
          NODE
